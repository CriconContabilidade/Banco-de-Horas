<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Banco de Horas - Cricon</title>
<style>
  :root {
    --bg: #202b38;
    --card-bg: #2a3746;
    --card-hover: #33414f;
    --accent: #3b82f6;
    --accent-dim: #2a5aa8;
    --text: #e6edf3;
    --text-dim: #a7b4c2;
    --border: #445164;
    --green: #34d399;
    --red: #f87171;
    --yellow: #fbbf24;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background: linear-gradient(180deg, var(--bg) 0%, #161f29 100%);
    color: var(--text);
  }
  a { color: var(--accent); }
  button { font-family: inherit; }
  input, select { font-family: inherit; }

  #loginScreen { min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:20px; }
  #loginScreen form {
    width: 100%; max-width: 340px; background: var(--card-bg); border: 1px solid var(--border);
    border-radius: 14px; padding: 28px; display: flex; flex-direction: column; gap: 14px;
  }
  #loginScreen h1 { text-align:center; font-size:1.3rem; margin:0 0 4px; }
  #loginScreen .sub { text-align:center; color:var(--text-dim); font-size:0.85rem; margin:0 0 10px; }
  #loginScreen label { font-size: 0.82rem; color: var(--text-dim); display: block; margin-bottom: 5px; }
  #loginScreen input {
    width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--border);
    background: #18212b; color: var(--text); font-size: 0.95rem;
  }
  #loginScreen input:focus { outline: none; border-color: var(--accent); }
  #loginScreen button[type="submit"] {
    background: var(--accent); color: white; border: none; border-radius: 8px; padding: 11px;
    font-size: 0.95rem; font-weight: 600; cursor: pointer; margin-top: 4px;
  }
  #loginScreen button[type="submit"]:disabled { opacity: 0.6; cursor: default; }
  #loginError { color: var(--red); font-size: 0.85rem; text-align: center; min-height: 1.2em; }

  .topbar {
    display:flex; align-items:center; justify-content:space-between; padding:14px 22px;
    border-bottom:1px solid var(--border); background:#18212b; position:sticky; top:0; z-index:5; flex-wrap:wrap; gap:10px;
  }
  .topbar h1 { font-size:1.1rem; margin:0; }
  .topbar .sub { color:var(--text-dim); font-size:0.78rem; }
  .userbar { display:flex; align-items:center; gap:10px; font-size:0.82rem; color:var(--text-dim); }
  .userbar button {
    background:none; border:1px solid var(--border); color:var(--text-dim); border-radius:8px;
    padding:6px 12px; font-size:0.78rem; cursor:pointer;
  }
  .userbar button:hover { border-color:var(--accent); color:var(--text); }
  .badge-admin { background:var(--accent-dim); color:white; padding:2px 8px; border-radius:20px; font-size:0.72rem; }

  .tabs { display:flex; gap:8px; padding:14px 22px 0; flex-wrap:wrap; }
  .tab {
    background: var(--card-bg); border: 1px solid var(--border); color: var(--text-dim);
    border-radius: 10px; padding: 8px 14px; font-size: 0.86rem; font-weight: 600; cursor: pointer;
  }
  .tab.active { background: var(--accent); border-color: var(--accent); color: white; }

  main { max-width: 1100px; margin: 0 auto; padding: 18px 22px 60px; }
  .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 14px; padding: 20px; margin-bottom:18px; }
  .card h2 { font-size:1rem; margin:0 0 14px; }
  .row { display:flex; gap:14px; flex-wrap:wrap; }

  .stat { flex:1; min-width:150px; background:#242f3c; border:1px solid var(--border); border-radius:10px; padding:14px 16px; }
  .stat .label { font-size:0.76rem; color:var(--text-dim); margin-bottom:4px; }
  .stat .value { font-size:1.5rem; font-weight:700; }
  .stat .value.pos { color: var(--green); }
  .stat .value.neg { color: var(--red); }

  .month-nav { display:flex; align-items:center; gap:10px; margin-bottom:14px; }
  .month-nav button { background:var(--card-hover); border:1px solid var(--border); color:var(--text); border-radius:8px; padding:6px 12px; cursor:pointer; }
  .month-nav .label { font-weight:600; min-width:150px; text-align:center; }

  table { width:100%; border-collapse: collapse; font-size:0.78rem; }
  th, td { border:1px solid var(--border); padding:2px 4px; text-align:center; line-height:1.2; }
  th { background:#242f3c; color:var(--text-dim); font-weight:600; font-size:0.68rem; text-transform:uppercase; padding:5px 4px; }
  td.dowend { background:#232e3b; }
  tr.weekend td { background: #232e3b; }
  tr.today td { outline: 2px solid var(--accent); outline-offset:-2px; }
  input.timecell {
    width: 56px; background:#18212b; border:1px solid var(--border); color:var(--text);
    border-radius:5px; padding:2px; text-align:center; font-size:0.76rem; line-height:1.3;
  }
  input.timecell:focus { outline:none; border-color:var(--accent); }
  select.occ {
    background:#18212b; border:1px solid var(--border); color:var(--text); border-radius:5px;
    padding:2px; font-size:0.7rem;
  }
  td.saldo.pos { color: var(--green); font-weight:600; }
  td.saldo.neg { color: var(--red); font-weight:600; }
  .toggle3 { display:flex; align-items:center; gap:8px; font-size:0.82rem; color:var(--text-dim); margin-bottom:10px; }

  .legend { font-size:0.76rem; color:var(--text-dim); margin-top:10px; line-height:1.6; }

  .funclist { display:flex; flex-direction:column; gap:8px; }
  .funcrow {
    display:flex; align-items:center; gap:14px; background:#242f3c; border:1px solid var(--border);
    border-radius:10px; padding:10px 14px; flex-wrap:wrap;
  }
  .funcrow .name { font-weight:600; flex:1; min-width:160px; }
  .funcrow .email { color:var(--text-dim); font-size:0.78rem; }
  .funcrow button {
    background:var(--card-hover); border:1px solid var(--border); color:var(--text); border-radius:8px;
    padding:6px 12px; cursor:pointer; font-size:0.8rem;
  }
  .funcrow button:hover { border-color:var(--accent); }

  .btn { background:var(--accent); color:white; border:none; border-radius:8px; padding:9px 16px; font-size:0.85rem; font-weight:600; cursor:pointer; }
  .btn.ghost { background:var(--card-hover); border:1px solid var(--border); color:var(--text); }
  .btn:hover { filter:brightness(1.1); }

  .savehint { font-size:0.74rem; color:var(--text-dim); margin-top:6px; }

  .jornada-grid { display:grid; grid-template-columns:auto auto 1fr 1fr; gap:10px 16px; align-items:center; font-size:0.8rem; }
  .jornada-grid .dname { color:var(--text-dim); }

  #printArea { display:none; }
  @media print {
    #app { display:none !important; }
    body { background:#fff; }
    #printArea { display:block !important; width:100%; padding:10px; color:#000; background:#fff; }
    #printArea h1 { font-size:18px; margin:0 0 2px; }
    #printArea h2 { font-size:12.5px; font-weight:500; color:#555; margin:0 0 14px; }
    #printArea table { width:100%; border-collapse:collapse; font-size:11px; }
    #printArea th, #printArea td { border:1px solid #999; padding:6px 8px; text-align:left; color:#000; }
    #printArea th { background:#fff; font-weight:700; }
    #printArea .assinatura { margin-top:70px; display:flex; justify-content:space-between; font-size:12px; }
    #printArea .assinatura div { border-top:1px solid #000; padding-top:4px; width:45%; }
  }

  .loading { text-align:center; padding:60px; color:var(--text-dim); }
</style>
</head>
<body>
<div id="app"><div class="loading">Carregando…</div></div>
<div id="printArea"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut,
  setPersistence, browserLocalPersistence
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {
  getFirestore, doc, getDoc, setDoc, collection, getDocs, query, where
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// Mesmo projeto Firebase do Hub de Ferramentas (login compartilhado no
// domínio criconcontabilidade.github.io).
const firebaseConfig = {
  apiKey: "AIzaSyBJF5e8R1kXmOc8u_e6wHpwwD4hYHJQcv4",
  authDomain: "fechamento-contabil-7f0b7.firebaseapp.com",
  projectId: "fechamento-contabil-7f0b7",
  storageBucket: "fechamento-contabil-7f0b7.firebasestorage.app",
  messagingSenderId: "661081450640",
  appId: "1:661081450640:web:dd144f63730a6a48465015",
  measurementId: "G-8M7FRZQ79C"
};

const ADMIN_EMAILS = ["contabilidadecricon@gmail.com", "guilherme.primetherapy@gmail.com"];
const COL_FUNC = "ponto_funcionarios";
const COL_REG = "ponto_registros";
const DOW = ["dom","seg","ter","qua","qui","sex","sab"];
const DOW_LABEL = ["Dom","Seg","Ter","Qua","Qui","Sex","Sáb"];
const OCC_LABEL = { "": "—", falta: "Falta", ferias: "Férias", folga: "Folga (compensação)", feriado: "Feriado" };

const JORNADA_PADRAO = {
  dom: { ativo:false }, sab: { ativo:false },
  seg: { ativo:true, ent1:"08:00", sai1:"12:00", ent2:"13:00", sai2:"18:00" },
  ter: { ativo:true, ent1:"08:00", sai1:"12:00", ent2:"13:00", sai2:"18:00" },
  qua: { ativo:true, ent1:"08:00", sai1:"12:00", ent2:"13:00", sai2:"18:00" },
  qui: { ativo:true, ent1:"08:00", sai1:"12:00", ent2:"13:00", sai2:"18:00" },
  sex: { ativo:true, ent1:"08:00", sai1:"12:00", ent2:"13:00", sai2:"17:00" },
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

function emailKey(email){
  return (email || "").trim().toLowerCase().replace(/[^a-z0-9]/g, "_");
}
function isAdminEmail(email){
  return ADMIN_EMAILS.includes((email||"").trim().toLowerCase());
}
function normalizeTimeStr(value){
  if(!value) return "";
  value = value.trim();
  const m = /^(\d{1,2})[:.,hH]?(\d{2})?$/.exec(value);
  if(!m) return value;
  return `${m[1].padStart(2,"0")}:${(m[2]||"00").padStart(2,"0")}`;
}
function parseHM(str){
  if(!str) return null;
  const m = /^(\d{1,2}):(\d{2})$/.exec(str.trim());
  if(!m) return null;
  const h = parseInt(m[1],10), mi = parseInt(m[2],10);
  if(isNaN(h)||isNaN(mi)) return null;
  return h*60+mi;
}
function fmtMin(min, showSign){
  min = Math.round(min);
  const sign = min < 0 ? "-" : (showSign ? "+" : "");
  min = Math.abs(min);
  const h = Math.floor(min/60), m = min%60;
  return `${sign}${h}:${String(m).padStart(2,"0")}`;
}
function expectedMinutes(dayCfg){
  if(!dayCfg || !dayCfg.ativo) return 0;
  let total = 0;
  for(const p of [["ent1","sai1"],["ent2","sai2"]]){
    const a = parseHM(dayCfg[p[0]]), b = parseHM(dayCfg[p[1]]);
    if(a!=null && b!=null && b>a) total += (b-a);
  }
  return total;
}
function workedMinutes(dia){
  if(!dia) return 0;
  let total = 0;
  for(const p of [["ent1","sai1"],["ent2","sai2"],["ent3","sai3"],["ent4","sai4"]]){
    const a = parseHM(dia[p[0]]), b = parseHM(dia[p[1]]);
    if(a!=null && b!=null && b>a) total += (b-a);
  }
  return total;
}
function dayDelta(dia, expected){
  const occ = (dia && dia.ocorrencia) || "";
  if(occ === "ferias" || occ === "feriado") return 0;
  if(occ === "falta") return -expected;
  if(occ === "folga") return -expected;
  const worked = workedMinutes(dia);
  // Dia em branco (nenhum horário digitado e nenhuma ocorrência marcada) =
  // considerado um dia normal, sem impacto no banco de horas. Só conta
  // diferença quando algo foi de fato preenchido (hora extra ou atraso).
  if(worked === 0) return 0;
  return worked - expected;
}
function diaDescontaFerias(dia){
  const occ = (dia && dia.ocorrencia) || "";
  return (occ === "falta" || occ === "ferias") ? 1 : 0;
}
function monthKey(ano, mes){ return `${ano}-${String(mes).padStart(2,"0")}`; }
function daysInMonth(ano, mes){ return new Date(ano, mes, 0).getDate(); }
function todayYMD(){ const d=new Date(); return {ano:d.getFullYear(), mes:d.getMonth()+1, dia:d.getDate()}; }

/* ---------------- state ---------------- */
let state = {
  screen: "boot", // boot | login | app
  user: null,
  isAdmin: false,
  tab: "meuponto", // meuponto | ferias | funcionarios
  viewEmail: null, // qual funcionário está sendo visto/editado
  cur: todayYMD(),
  funcDoc: null,
  regDoc: null,
  show3: false,
  show4: false,
  funcList: [],
  loadingReg: false,
  saveTimer: null,
  saveStatus: "",
};

async function ensureFuncDoc(email){
  const key = emailKey(email);
  const ref = doc(db, COL_FUNC, key);
  const snap = await getDoc(ref);
  if(snap.exists()) return { id:key, ...snap.data() };
  const novo = {
    email: email.toLowerCase(),
    nome: email.split("@")[0],
    jornada: JORNADA_PADRAO,
    feriasSaldoBase: 30,
    feriasBaseEm: new Date().toISOString().slice(0,10),
    ativo: true,
    criadoEm: Date.now()
  };
  await setDoc(ref, novo);
  return { id:key, ...novo };
}

async function loadRegistro(email, ano, mes){
  const key = emailKey(email);
  const id = `${key}_${monthKey(ano,mes)}`;
  const ref = doc(db, COL_REG, id);
  const snap = await getDoc(ref);
  if(snap.exists()) return { id, ...snap.data() };
  return { id, ownerEmail: email.toLowerCase(), emailKey:key, ano, mes, dias:{} };
}

async function saveRegistro(regDoc){
  const ref = doc(db, COL_REG, regDoc.id);
  await setDoc(ref, {
    ownerEmail: regDoc.ownerEmail, emailKey: regDoc.emailKey,
    ano: regDoc.ano, mes: regDoc.mes, dias: regDoc.dias, updatedAt: Date.now()
  });
}

async function saveFuncDoc(funcDoc){
  const ref = doc(db, COL_FUNC, funcDoc.id);
  const { id, ...data } = funcDoc;
  await setDoc(ref, data);
}

async function loadAllFuncionarios(){
  const snap = await getDocs(collection(db, COL_FUNC));
  const list = [];
  snap.forEach(d => list.push({ id:d.id, ...d.data() }));
  list.sort((a,b) => (a.nome||"").localeCompare(b.nome||""));
  return list;
}

async function loadAllRegistros(email){
  const key = emailKey(email);
  const q = query(collection(db, COL_REG), where("emailKey","==",key));
  const snap = await getDocs(q);
  const list = [];
  snap.forEach(d => list.push({ id:d.id, ...d.data() }));
  return list;
}

function computeRegDocDelta(regDoc, jornada){
  if(!regDoc) return 0;
  let total = 0;
  const nDias = daysInMonth(regDoc.ano, regDoc.mes);
  for(let d=1; d<=nDias; d++){
    const dt = new Date(regDoc.ano, regDoc.mes-1, d);
    const cfg = jornada[DOW[dt.getDay()]];
    const expected = expectedMinutes(cfg);
    const dia = (regDoc.dias && regDoc.dias[d]) || {};
    total += dayDelta(dia, expected);
  }
  return total;
}
function computeSaldoBanco(registros, jornada){
  return registros.reduce((sum, reg) => sum + computeRegDocDelta(reg, jornada), 0);
}
function computeFeriasDescontadas(registros, baseEm){
  const base = baseEm ? new Date(baseEm+"T00:00:00") : null;
  let dias = 0;
  for(const reg of registros){
    for(const diaStr of Object.keys(reg.dias||{})){
      const dia = reg.dias[diaStr];
      const diaNum = parseInt(diaStr,10);
      const dt = new Date(reg.ano, reg.mes-1, diaNum);
      if(base && dt < base) continue;
      dias += diaDescontaFerias(dia);
    }
  }
  return dias;
}

/* ---------------- render ---------------- */
const appEl = document.getElementById("app");

function render(){
  if(state.screen === "boot"){
    appEl.innerHTML = `<div class="loading">Carregando…</div>`;
    return;
  }
  if(state.screen === "login"){
    appEl.innerHTML = `
    <div id="loginScreen">
      <form id="loginForm">
        <h1>🕒 Banco de Horas</h1>
        <div class="sub">Contabilidade Cricon</div>
        <div>
          <label for="loginEmail">E-mail</label>
          <input type="email" id="loginEmail" autocomplete="username" required>
        </div>
        <div>
          <label for="loginPassword">Senha</label>
          <input type="password" id="loginPassword" autocomplete="current-password" required>
        </div>
        <div id="loginError"></div>
        <button type="submit" id="loginSubmit">Entrar</button>
        <div class="sub">Use o mesmo e-mail/senha do Hub de Ferramentas.</div>
      </form>
    </div>`;
    document.getElementById("loginForm").addEventListener("submit", handleLogin);
    return;
  }

  // app
  const email = state.user.email;
  const viewEmail = state.viewEmail || email;
  const viewingOther = viewEmail.toLowerCase() !== email.toLowerCase();

  let html = `
  <div class="topbar">
    <div>
      <h1>🕒 Banco de Horas</h1>
      <div class="sub">Contabilidade Cricon</div>
    </div>
    <div class="userbar">
      ${state.isAdmin ? `<span class="badge-admin">admin</span>` : ``}
      <span>${email}</span>
      <button id="btnLogout">Sair</button>
    </div>
  </div>
  <div class="tabs">
    <div class="tab ${state.tab==='meuponto'?'active':''}" data-tab="meuponto">📅 ${viewingOther ? 'Ponto de '+ (state.funcDoc?.nome||viewEmail) : 'Meu Ponto'}</div>
    <div class="tab ${state.tab==='ferias'?'active':''}" data-tab="ferias">🏖️ Férias</div>
    ${state.isAdmin ? `<div class="tab ${state.tab==='funcionarios'?'active':''}" data-tab="funcionarios">👥 Funcionários</div>` : ``}
  </div>
  <main>`;

  if(viewingOther){
    html += `<div class="card" style="padding:10px 16px;display:flex;align-items:center;gap:10px;">
      <span>Visualizando/editando como administrador: <b>${state.funcDoc?.nome||''}</b> (${viewEmail})</span>
      <button class="btn ghost" id="btnVoltarMeu" style="margin-left:auto;">Voltar ao meu ponto</button>
    </div>`;
  }

  if(state.tab === "meuponto"){
    html += renderMeuPonto();
  } else if(state.tab === "ferias"){
    html += renderFerias();
  } else if(state.tab === "funcionarios"){
    html += renderFuncionarios();
  }

  html += `</main>`;
  appEl.innerHTML = html;
  bindAppEvents();
}

function renderMeuPonto(){
  if(state.loadError){
    return `<div class="card"><div class="loading" style="color:var(--red);">${state.loadError}</div></div>`;
  }
  if(!state.regDoc || state.loadingReg){
    return `<div class="loading">Carregando ponto…</div>`;
  }
  const { ano, mes } = state.cur;
  const nDias = daysInMonth(ano, mes);
  const jornada = (state.funcDoc && state.funcDoc.jornada) || JORNADA_PADRAO;
  const monthNames = ["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];
  const today = todayYMD();

  let totalMin = 0;
  let rows = "";
  for(let d=1; d<=nDias; d++){
    const dt = new Date(ano, mes-1, d);
    const dow = dt.getDay();
    const dia = state.regDoc.dias[d] || {};
    const cfg = jornada[DOW[dow]];
    const expected = expectedMinutes(cfg);
    const delta = dayDelta(dia, expected);
    totalMin += delta;
    const worked = workedMinutes(dia);
    const isWeekend = dow===0 || dow===6;
    const isToday = today.ano===ano && today.mes===mes && today.dia===d;
    rows += `<tr class="${isWeekend?'weekend':''} ${isToday?'today':''}">
      <td>${d}</td>
      <td>${DOW_LABEL[dow]}</td>
      <td>
        <select class="occ" data-day="${d}" data-field="ocorrencia">
          ${Object.entries(OCC_LABEL).map(([k,l])=>`<option value="${k}" ${dia.ocorrencia===k?'selected':''}>${l}</option>`).join("")}
        </select>
      </td>
      <td><input class="timecell" type="text" placeholder="--:--" value="${dia.ent1||''}" data-day="${d}" data-field="ent1"></td>
      <td><input class="timecell" type="text" placeholder="--:--" value="${dia.sai1||''}" data-day="${d}" data-field="sai1"></td>
      <td><input class="timecell" type="text" placeholder="--:--" value="${dia.ent2||''}" data-day="${d}" data-field="ent2"></td>
      <td><input class="timecell" type="text" placeholder="--:--" value="${dia.sai2||''}" data-day="${d}" data-field="sai2"></td>
      ${state.show3 ? `
      <td><input class="timecell" type="text" placeholder="--:--" value="${dia.ent3||''}" data-day="${d}" data-field="ent3"></td>
      <td><input class="timecell" type="text" placeholder="--:--" value="${dia.sai3||''}" data-day="${d}" data-field="sai3"></td>
      ` : ``}
      ${state.show4 ? `
      <td><input class="timecell" type="text" placeholder="--:--" value="${dia.ent4||''}" data-day="${d}" data-field="ent4"></td>
      <td><input class="timecell" type="text" placeholder="--:--" value="${dia.sai4||''}" data-day="${d}" data-field="sai4"></td>
      ` : ``}
      <td>${fmtMin(worked)}</td>
      <td>${fmtMin(expected)}</td>
      <td class="saldo ${delta>0?'pos':(delta<0?'neg':'')}">${fmtMin(delta, true)}</td>
    </tr>`;
  }

  const jornadaRows = DOW.map((k,i) => {
    const cfg = jornada[k] || { ativo:false };
    return `<div class="dname">${DOW_LABEL[i]}</div>
      <div><input type="checkbox" data-jdow="${k}" data-jfield="ativo" ${cfg.ativo?'checked':''}></div>
      <div><input class="timecell" style="width:56px" type="text" placeholder="--:--" data-jdow="${k}" data-jfield="ent1" value="${cfg.ent1||''}"> – <input class="timecell" style="width:56px" type="text" placeholder="--:--" data-jdow="${k}" data-jfield="sai1" value="${cfg.sai1||''}"></div>
      <div><input class="timecell" style="width:56px" type="text" placeholder="--:--" data-jdow="${k}" data-jfield="ent2" value="${cfg.ent2||''}"> – <input class="timecell" style="width:56px" type="text" placeholder="--:--" data-jdow="${k}" data-jfield="sai2" value="${cfg.sai2||''}"></div>`;
  }).join("");

  return `
  <details class="card">
    <summary style="cursor:pointer;font-weight:600;">⚙️ Jornada de trabalho (horário esperado por dia da semana)</summary>
    <div class="jornada-grid" style="margin-top:12px;">
      <div></div><div>Ativo</div><div>1º turno</div><div>2º turno</div>
      ${jornadaRows}
    </div>
    <button class="btn" id="btnSalvarJornada" style="margin-top:12px;">Salvar jornada</button>
  </details>
  <div class="card">
    <div class="month-nav">
      <button id="btnPrevMonth">←</button>
      <div class="label">${monthNames[mes-1]} de ${ano}</div>
      <button id="btnNextMonth">→</button>
      <button class="btn ghost" id="btnImprimirPonto" style="margin-left:auto;">🖨️ Imprimir para assinar</button>
      <span class="savehint">${state.saveStatus}</span>
    </div>
    <label class="toggle3">
      <input type="checkbox" id="chkShow3" ${state.show3?'checked':''}>
      Mostrar 3º par de entrada/saída (para quem sai e volta mais de uma vez no dia)
    </label>
    <label class="toggle3">
      <input type="checkbox" id="chkShow4" ${state.show4?'checked':''}>
      Mostrar 4º par de entrada/saída (bem raro)
    </label>
    <div style="overflow-x:auto;">
    <table>
      <thead><tr>
        <th>Dia</th><th>Sem.</th><th>Ocorrência</th>
        <th>Ent.1</th><th>Saí.1</th><th>Ent.2</th><th>Saí.2</th>
        ${state.show3 ? `<th>Ent.3</th><th>Saí.3</th>` : ``}
        ${state.show4 ? `<th>Ent.4</th><th>Saí.4</th>` : ``}
        <th>Trabalhado</th><th>Esperado</th><th>Saldo dia</th>
      </tr></thead>
      <tbody>${rows}</tbody>
    </table>
    </div>
    <div class="legend">
      Dia em branco (sem horário e sem ocorrência) = dia normal, não desconta nada do banco de horas — não precisa preencher todo dia, só o que sair do padrão.<br>
      Preencha os horários apenas para registrar <b>hora extra</b> (saiu depois do horário) ou <b>atraso</b> (chegou depois/saiu antes) — a diferença entra no saldo automaticamente.<br>
      Ocorrências: <b>Falta</b> = desconta o dia do banco de horas e 1 dia da férias a vencer.
      <b>Férias</b> = desconta 1 dia da férias a vencer, sem afetar o banco de horas.
      <b>Folga (compensação)</b> = usa horas do banco para cobrir o dia, sem afetar as férias.
      <b>Feriado</b> = neutro, não afeta nada.
    </div>
  </div>
  <div class="row">
    <div class="stat">
      <div class="label">Saldo até o mês anterior</div>
      <div class="value" id="statSaldoAnterior">…</div>
    </div>
    <div class="stat">
      <div class="label">Saldo deste mês</div>
      <div class="value ${totalMin>0?'pos':(totalMin<0?'neg':'')}">${fmtMin(totalMin, true)}</div>
    </div>
    <div class="stat">
      <div class="label">Saldo final do banco de horas</div>
      <div class="value" id="statSaldoTotal">…</div>
    </div>
  </div>`;
}

function renderFuncionarios(){
  if(state.loadingFunc) return `<div class="loading">Carregando funcionários…</div>`;
  let rows = state.funcList.map(f => `
    <div class="funcrow">
      <div class="name">${f.nome}</div>
      <div class="email">${f.email}</div>
      <button data-view="${f.email}">Ver / editar ponto</button>
    </div>
  `).join("");

    <button class="btn" id="btnResumoPdf">Gerar resumo em PDF (todos os funcionários)</button>
    <div class="sub" style="margin-top:8px;">Abre a janela de impressão do navegador — escolha "Salvar como PDF".</div>
  </div>`;
}

/* ---------------- events ---------------- */
function bindAppEvents(){
  const q = sel => appEl.querySelector(sel);
  const qa = sel => appEl.querySelectorAll(sel);

  appEl.querySelectorAll(".tab").forEach(el => {
    el.addEventListener("click", () => { state.tab = el.dataset.tab; onTabChange(); });
  });
  if(q("#btnLogout")) q("#btnLogout").addEventListener("click", () => signOut(auth));
  if(q("#btnVoltarMeu")) q("#btnVoltarMeu").addEventListener("click", () => {
    state.viewEmail = null;
    loadForCurrentView().then(render);
  });

  if(q("#btnPrevMonth")) q("#btnPrevMonth").addEventListener("click", () => changeMonth(-1));
  if(q("#btnNextMonth")) q("#btnNextMonth").addEventListener("click", () => changeMonth(1));
  if(q("#chkShow3")) q("#chkShow3").addEventListener("change", e => { state.show3 = e.target.checked; render(); });
  if(q("#chkShow4")) q("#chkShow4").addEventListener("change", e => { state.show4 = e.target.checked; render(); });

  qa("input.timecell[data-day], select.occ[data-day]").forEach(el => {
    el.addEventListener("change", onDayFieldChange);
  });

  if(q("#btnSalvarFerias")) q("#btnSalvarFerias").addEventListener("click", onSalvarFerias);
  if(q("#btnSalvarJornada")) q("#btnSalvarJornada").addEventListener("click", onSalvarJornada);
  if(q("#btnResumoPdf")) q("#btnResumoPdf").addEventListener("click", gerarResumoPdf);
  if(q("#btnImprimirPonto")) q("#btnImprimirPonto").addEventListener("click", imprimirPonto);
  qa("[data-view]").forEach(el => el.addEventListener("click", () => {
    state.viewEmail = el.dataset.view;
    state.tab = "meuponto";
    loadForCurrentView().then(render);
  }));

  if(state.tab === "meuponto") refreshSaldoTotal();
  if(state.tab === "ferias") refreshFerias();
}

function onTabChange(){
  if(state.tab === "funcionarios" && state.funcList.length === 0){
    state.loadingFunc = true;
    render();
    loadAllFuncionarios().then(list => { state.funcList = list; state.loadingFunc = false; render(); });
    return;
  }
  render();
}

async function changeMonth(delta){
  let { ano, mes } = state.cur;
  mes += delta;
  if(mes < 1){ mes = 12; ano--; }
  if(mes > 12){ mes = 1; ano++; }
  state.cur = { ano, mes, dia: 1 };
  state.loadingReg = true;
  render();
  const email = state.viewEmail || state.user.email;
  state.regDoc = await loadRegistro(email, ano, mes);
  state.loadingReg = false;
  render();
}

function onDayFieldChange(e){
  const day = e.target.dataset.day;
  const field = e.target.dataset.field;
  let value = e.target.value;
  if(field !== "ocorrencia" && value){
    value = normalizeTimeStr(value);
    e.target.value = value;
  }
  if(!state.regDoc.dias[day]) state.regDoc.dias[day] = {};
  state.regDoc.dias[day][field] = value;
  scheduleSave();
  // re-render just the affected row's computed cells without losing focus: simplest is full re-render on blur-safe fields
  renderRowComputed(day);
}

function renderRowComputed(day){
  const { ano, mes } = state.cur;
  const jornada = (state.funcDoc && state.funcDoc.jornada) || JORNADA_PADRAO;
  const dt = new Date(ano, mes-1, parseInt(day,10));
  const cfg = jornada[DOW[dt.getDay()]];
  const expected = expectedMinutes(cfg);
  const dia = state.regDoc.dias[day] || {};
  const worked = workedMinutes(dia);
  const delta = dayDelta(dia, expected);
  const row = [...appEl.querySelectorAll("tbody tr")].find(tr => tr.firstElementChild.textContent === String(day));
  if(row){
    const tds = row.querySelectorAll("td");
    tds[tds.length-3].textContent = fmtMin(worked);
    tds[tds.length-2].textContent = fmtMin(expected);
    const saldoTd = tds[tds.length-1];
    saldoTd.textContent = fmtMin(delta, true);
    saldoTd.className = "saldo " + (delta>0?"pos":(delta<0?"neg":""));
  }
  refreshSaldoTotal();
}

function scheduleSave(){
  state.saveStatus = "Salvando…";
  const hint = appEl.querySelector(".savehint");
  if(hint) hint.textContent = state.saveStatus;
  if(state.saveTimer) clearTimeout(state.saveTimer);
  state.saveTimer = setTimeout(async () => {
    try{
      await saveRegistro(state.regDoc);
      state.saveStatus = "Salvo ✓";
    }catch(err){
      console.error("Erro ao salvar ponto:", err);
      state.saveStatus = "⚠️ Erro ao salvar! Verifique sua conexão e tente de novo.";
    }
    const hint2 = appEl.querySelector(".savehint");
    if(hint2) hint2.textContent = state.saveStatus;
  }, 700);
}

async function refreshSaldoTotal(){
  if(!document.getElementById("statSaldoTotal") && !document.getElementById("statSaldoAnterior")) return;
  try{
    const email = state.viewEmail || state.user.email;
    const jornada = (state.funcDoc && state.funcDoc.jornada) || JORNADA_PADRAO;
    const { ano, mes } = state.cur;
    const registros = await loadAllRegistros(email);
    const outros = registros.filter(r => !(r.ano === ano && r.mes === mes));
    const saldoAnterior = computeSaldoBanco(outros, jornada);
    const saldoMes = computeRegDocDelta(state.regDoc, jornada);
    const saldoFinal = saldoAnterior + saldoMes;
    const elA = document.getElementById("statSaldoAnterior");
    const elT = document.getElementById("statSaldoTotal");
    if(elA){ elA.textContent = fmtMin(saldoAnterior, true); elA.className = "value " + (saldoAnterior>0?"pos":(saldoAnterior<0?"neg":"")); }
    if(elT){ elT.textContent = fmtMin(saldoFinal, true); elT.className = "value " + (saldoFinal>0?"pos":(saldoFinal<0?"neg":"")); }
  }catch(err){
    console.error("Erro ao calcular saldo total:", err);
    const msg = "Erro: " + (err && (err.code || err.message) || err);
    const elA = document.getElementById("statSaldoAnterior");
    const elT = document.getElementById("statSaldoTotal");
    if(elA){ elA.textContent = msg; elA.style.fontSize = "0.85rem"; }
    if(elT){ elT.textContent = msg; elT.style.fontSize = "0.85rem"; }
  }
}

async function refreshFerias(){
  const email = state.viewEmail || state.user.email;
  const registros = await loadAllRegistros(email);
  const descontadas = computeFeriasDescontadas(registros, state.funcDoc.feriasBaseEm);
  const base = state.funcDoc.feriasSaldoBase ?? 30;
  const atual = base - descontadas;
  const elD = document.getElementById("statFeriasDescontadas");
  const elA = document.getElementById("statFeriasAtual");
  if(elD) elD.textContent = descontadas;
  if(elA){ elA.textContent = atual; elA.className = "value " + (atual<0?"neg":"pos"); }
}

async function onSalvarFerias(){
  const base = parseFloat(document.getElementById("inpFeriasBase").value || "0");
  const data = document.getElementById("inpFeriasData").value;
  state.funcDoc.feriasSaldoBase = base;
  state.funcDoc.feriasBaseEm = data;
  await saveFuncDoc(state.funcDoc);
  refreshFerias();
}

async function onSalvarJornada(){
  const jornada = {};
  DOW.forEach(k => {
    const ativoEl = appEl.querySelector(`[data-jdow="${k}"][data-jfield="ativo"]`);
    const ativo = ativoEl ? ativoEl.checked : false;
    const get = f => {
      const el = appEl.querySelector(`[data-jdow="${k}"][data-jfield="${f}"]`);
      return el ? normalizeTimeStr(el.value) : "";
    };
    jornada[k] = ativo ? { ativo:true, ent1:get("ent1"), sai1:get("sai1"), ent2:get("ent2"), sai2:get("sai2") } : { ativo:false };
  });
  state.funcDoc.jornada = jornada;
  await saveFuncDoc(state.funcDoc);
  render();
  refreshSaldoTotal();
}

async function imprimirPonto(){
  const { ano, mes } = state.cur;
  const jornada = (state.funcDoc && state.funcDoc.jornada) || JORNADA_PADRAO;
  const monthNames = ["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];
  const nDias = daysInMonth(ano, mes);
  const email = state.viewEmail || state.user.email;

  let saldoAnterior = 0;
  try{
    const registros = await loadAllRegistros(email);
    const outros = registros.filter(r => !(r.ano === ano && r.mes === mes));
    saldoAnterior = computeSaldoBanco(outros, jornada);
  }catch(err){
    console.error("Erro ao calcular saldo anterior para impressão:", err);
  }

  const pares = [["ent1","sai1"],["ent2","sai2"]];
  if(state.show3) pares.push(["ent3","sai3"]);
  if(state.show4) pares.push(["ent4","sai4"]);
  const nCols = 3 + pares.length*2;

  let acumulado = saldoAnterior;
  let rows = `<tr>
    <td colspan="${nCols}" style="text-align:right;"><b>Saldo anterior</b></td>
    <td>—</td><td><b>${fmtMin(saldoAnterior, true)}</b></td>
  </tr>`;
  for(let d=1; d<=nDias; d++){
    const dt = new Date(ano, mes-1, d);
    const dow = dt.getDay();
    const dia = state.regDoc.dias[d] || {};
    const cfg = jornada[DOW[dow]];
    const expected = expectedMinutes(cfg);
    const delta = dayDelta(dia, expected);
    acumulado += delta;
    const horarioCells = pares.map(([e,s]) => `<td>${dia[e]||""}</td><td>${dia[s]||""}</td>`).join("");
    rows += `<tr>
      <td>${d}</td><td>${DOW_LABEL[dow]}</td>
      <td>${OCC_LABEL[dia.ocorrencia || ""]}</td>
      ${horarioCells}
      <td>${fmtMin(delta, true)}</td><td>${fmtMin(acumulado, true)}</td>
    </tr>`;
  }
  const horarioHeaders = pares.map((p,i) => `<th>Ent.${i+1}</th><th>Saí.${i+1}</th>`).join("");
  const printArea = document.getElementById("printArea");
  printArea.innerHTML = `
    <h1>Controle de Ponto — ${state.funcDoc.nome || ""}</h1>
    <h2>${monthNames[mes-1]} de ${ano} — Contabilidade Cricon</h2>
    <table>
      <thead><tr>
        <th>Dia</th><th>Sem.</th><th>Ocorrência</th>${horarioHeaders}
        <th>Saldo do dia</th><th>Saldo acumulado</th>
      </tr></thead>
      <tbody>${rows}</tbody>
    </table>
    <div class="assinatura">
      <div>Assinatura do(a) funcionário(a)</div>
      <div>Data: ____/____/________</div>
    </div>
  `;
  window.print();
}

async function gerarResumoPdf(){
  const printArea = document.getElementById("printArea");
  printArea.innerHTML = `<div class="loading">Gerando…</div>`;
  let rowsHtml = "";
  for(const f of state.funcList){
    const registros = await loadAllRegistros(f.email);
    const jornada = f.jornada || JORNADA_PADRAO;
    const saldoBanco = computeSaldoBanco(registros, jornada);
    const descontadas = computeFeriasDescontadas(registros, f.feriasBaseEm);
    const feriasAtual = (f.feriasSaldoBase ?? 30) - descontadas;
    rowsHtml += `<tr>
      <td>${f.nome}</td><td>${f.email}</td>
      <td>${fmtMin(saldoBanco, true)}</td>
      <td>${feriasAtual} dias</td>
    </tr>`;
  }
  printArea.innerHTML = `
    <h1>Resumo do Banco de Horas e Férias</h1>
    <h2>Contabilidade Cricon — gerado em ${new Date().toLocaleString("pt-BR")}</h2>
    <table>
      <thead><tr><th>Funcionário</th><th>E-mail</th><th>Saldo banco de horas</th><th>Férias a vencer</th></tr></thead>
      <tbody>${rowsHtml}</tbody>
    </table>`;
  window.print();
}

/* ---------------- load / boot ---------------- */
async function loadForCurrentView(){
  const email = state.viewEmail || state.user.email;
  state.loadingReg = true;
  state.loadError = null;
  try{
    state.funcDoc = await ensureFuncDoc(email);
    const { ano, mes } = state.cur;
    state.regDoc = await loadRegistro(email, ano, mes);
  }catch(err){
    console.error("Erro ao carregar ponto:", err);
    state.loadError = "Não foi possível carregar. Verifique sua conexão ou as permissões no Firestore. (" + (err && err.message || err) + ")";
  }finally{
    state.loadingReg = false;
  }
}

async function handleLogin(e){
  e.preventDefault();
  const errEl = document.getElementById("loginError");
  const btn = document.getElementById("loginSubmit");
  errEl.textContent = "";
  btn.disabled = true; btn.textContent = "Entrando…";
  const email = document.getElementById("loginEmail").value;
  const password = document.getElementById("loginPassword").value;
  try{
    await setPersistence(auth, browserLocalPersistence);
    await signInWithEmailAndPassword(auth, email, password);
  }catch(err){
    errEl.textContent = "E-mail ou senha inválidos.";
  }
  btn.disabled = false; btn.textContent = "Entrar";
}

/* ---------------- navegação por teclado (estilo Excel) ---------------- */
function gridColumns(){
  const cols = ["ocorrencia","ent1","sai1","ent2","sai2"];
  if(state.show3) cols.push("ent3","sai3");
  if(state.show4) cols.push("ent4","sai4");
  return cols;
}
function focusGridCell(day, colIdx){
  const cols = gridColumns();
  const nDias = daysInMonth(state.cur.ano, state.cur.mes);
  if(day < 1 || day > nDias || colIdx < 0 || colIdx >= cols.length) return false;
  const field = cols[colIdx];
  const sel = field === "ocorrencia"
    ? `select.occ[data-day="${day}"]`
    : `input.timecell[data-day="${day}"][data-field="${field}"]`;
  const target = appEl.querySelector(sel);
  if(!target) return false;
  target.focus();
  if(typeof target.select === "function") target.select();
  return true;
}
function onGridKeydown(e){
  const el = e.target;
  if(!el.dataset || el.dataset.day === undefined) return;
  const day = parseInt(el.dataset.day, 10);
  const field = el.dataset.field;
  const cols = gridColumns();
  const colIdx = cols.indexOf(field);
  if(colIdx === -1) return;
  const isSelect = el.tagName === "SELECT";
  if(e.key === "Enter"){
    e.preventDefault();
    focusGridCell(day+1, colIdx);
  } else if(e.key === "ArrowDown"){
    e.preventDefault();
    focusGridCell(day+1, colIdx);
  } else if(e.key === "ArrowUp"){
    e.preventDefault();
    focusGridCell(day-1, colIdx);
  } else if(e.key === "ArrowRight"){
    if(isSelect || (el.selectionStart === el.value.length && el.selectionEnd === el.value.length)){
      e.preventDefault();
      focusGridCell(day, colIdx+1);
    }
  } else if(e.key === "ArrowLeft"){
    if(isSelect || (el.selectionStart === 0 && el.selectionEnd === 0)){
      e.preventDefault();
      focusGridCell(day, colIdx-1);
    }
  }
}
appEl.addEventListener("keydown", onGridKeydown);
appEl.addEventListener("focusin", e => {
  if(e.target.classList && e.target.classList.contains("timecell")) e.target.select();
});

onAuthStateChanged(auth, async (user) => {
  if(user){
    state.user = user;
    state.isAdmin = isAdminEmail(user.email);
    state.screen = "app";
    await loadForCurrentView();
    render();
  } else {
    state.user = null;
    state.screen = "login";
    render();
  }
});

render();

  }
}, 8000);
